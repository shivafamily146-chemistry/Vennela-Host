services:
  vennela-host:
    build: .
    container_name: vennela-host
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "25565:25565/tcp"
      - "19132:19132/udp"
    environment:
      PANEL_PASSWORD: ${PANEL_PASSWORD:?Set PANEL_PASSWORD in .env}
      SERVER_JAR: ${SERVER_JAR:-server.jar}
      JAVA_ARGS: ${JAVA_ARGS:--Xms2G -Xmx5G}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://shivafamily146-chemistry.github.io}
    volumes:
      - vennela-data:/data
    stop_grace_period: 40s

volumes:
  vennela-data:
