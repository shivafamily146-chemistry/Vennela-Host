name: Validate Vennela Host
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend syntax
        run: node --check backend/server.js
      - name: Check frontend syntax
        run: node --check app.js
      - name: Validate package metadata
        run: node -e "JSON.parse(require('fs').readFileSync('backend/package.json','utf8'))"
